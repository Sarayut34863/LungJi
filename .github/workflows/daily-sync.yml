name: Daily MTG Card Kingdom Price Sync

on:
  schedule:
    # Runs automatically every day at 04:00 UTC (11:00 AM Thailand time)
    # Card Kingdom publishes its daily dump overnight (~20:00 UTC)
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual run button in GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Sync latest prices from Card Kingdom API
        run: node scripts/sync-prices.js

      - name: Commit and push updated database
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(prices): automated daily Card Kingdom price sync"
          file_pattern: "src/data/cards.db"

      - name: Deploy to Vercel (if VERCEL_TOKEN configured)
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
